# UI/UX 시각 검증용 — 주요 화면 상태를 스크린샷으로 캡처한다(자동 assert 로는
# 색/레이아웃/그림자/hot tint 를 못 잡으므로 다른 세션에서 눈으로 리뷰).
# 산출물: 실행 디렉터리에 01~07 png. Hot 카드(월세), 3중 인코딩 배수, 시트 등 포함.
# ADR-067: 온보딩은 페르소나가 아니라 '도시 선택' — 도시를 고르면 곧바로 Compare 로 진입한다.
appId: com.laegel.overseascostapp
tags:
  - visual
---
- launchApp:
    clearState: true
- assertVisible:
    id: 'onboarding-screen'
- takeScreenshot: '.maestro/.artifacts/01-onboarding'
# 도시 선택 → 서울 vs 밴쿠버 Compare 직행
- tapOn:
    id: 'onboarding-city-vancouver'
- assertVisible:
    id: 'compare-screen'
- takeScreenshot: '.maestro/.artifacts/03-compare'
- tapOn:
    id: 'compare-pair-food'
- assertVisible:
    id: 'detail-screen'
- takeScreenshot: '.maestro/.artifacts/04-detail-food'
- tapOn:
    id: 'detail-topbar-back'
# takeScreenshot 직후의 첫 탭은 간헐적으로 내비게이션을 놓친다 — 상세에 남아 있으면 재탭한다.
- runFlow:
    when:
      visible:
        id: 'detail-topbar-back'
    commands:
      - tapOn:
          id: 'detail-topbar-back'
# 뒤로가기 애니메이션이 끝나 compare 가 다시 렌더될 때까지 기다린 뒤 다음 카드를 탭한다
# (동기화 지점 없이 바로 탭하면 전환 중이라 compare-pair-tuition 을 못 찾는다).
- assertVisible:
    id: 'compare-screen'
- tapOn:
    id: 'compare-pair-tuition'
- assertVisible:
    id: 'detail-screen'
- takeScreenshot: '.maestro/.artifacts/05-detail-tuition'
- tapOn:
    id: 'detail-picker-change-tuition'
# 시트 순수 testID 노드는 없다 — body 로 검증 (backdrop/body/preset 등 접두사 형태).
- assertVisible:
    id: 'detail-tuition-sheet-body'
- takeScreenshot: '.maestro/.artifacts/06-tuition-sheet'
- tapOn:
    id: 'detail-tuition-sheet-backdrop'
- tapOn:
    id: 'detail-topbar-back'
- assertVisible:
    id: 'compare-screen'
- tapOn:
    id: 'compare-topbar-back'
- assertVisible:
    id: 'home-screen'
# 온보딩에서 담은 밴쿠버가 즐겨찾기에 있어 홈은 '빈 상태'가 아니다 (02-home).
- takeScreenshot: '.maestro/.artifacts/02-home'
- tapOn:
    id: 'home-avatar'
# takeScreenshot(02-home) 직후의 첫 탭은 간헐적으로 내비게이션을 놓친다 — detail-topbar-back
# 과 동일 패턴으로, 홈에 남아 있으면(home-avatar 가 여전히 보이면) 재탭한다.
- runFlow:
    when:
      visible:
        id: 'home-avatar'
    commands:
      - tapOn:
          id: 'home-avatar'
- assertVisible:
    id: 'settings-screen'
- takeScreenshot: '.maestro/.artifacts/07-settings'
# ADR-071: 설정의 '데이터 출처 보기'·'개인정보 처리방침' 이 외부 링크에서 앱 내부 화면이
# 되었다. 아래 3컷은 그 신규 화면들 — 출처 목록(08) → 도시별 출처(09) → 처리방침(10).
# 도시는 밴쿠버를 고른다: tuition·visa 출처가 있어 step 0 이 교체한 도시별 공공 출처
# (대학 공식 페이지 / 이민당국 페이지)가 실제로 렌더되는지 눈으로 확인할 수 있다.
- tapOn:
    id: 'menu-sources'
- runFlow:
    when:
      visible:
        id: 'menu-sources'
    commands:
      - tapOn:
          id: 'menu-sources'
- assertVisible:
    id: 'sources-screen'
- takeScreenshot: '.maestro/.artifacts/08-sources'
- tapOn:
    id: 'source-city-vancouver'
- runFlow:
    when:
      visible:
        id: 'source-city-vancouver'
    commands:
      - tapOn:
          id: 'source-city-vancouver'
- assertVisible:
    id: 'source-city-screen'
- takeScreenshot: '.maestro/.artifacts/09-source-city'
- tapOn:
    id: 'source-city-topbar-back'
- assertVisible:
    id: 'sources-screen'
- tapOn:
    id: 'sources-topbar-back'
- assertVisible:
    id: 'settings-screen'
- tapOn:
    id: 'menu-privacy'
- assertVisible:
    id: 'privacy-screen'
- takeScreenshot: '.maestro/.artifacts/10-privacy'
