# UC-7: 한글 도시명 검색 → 결과 → 탭하면 Compare 진입.
appId: com.laegel.overseascostapp
tags:
  - home
  - search
---
- runFlow: ../../common/onboard.yaml
- tapOn:
    id: 'home-search-input'
- inputText: '밴쿠버'
# 키보드를 내려야 결과 행 탭이 흡수되지 않는다 (ScrollView keyboardShouldPersistTaps 기본).
- hideKeyboard
- assertVisible:
    id: 'home-search-results'
- assertVisible:
    id: 'home-search-result-vancouver'
- tapOn:
    id: 'home-search-result-vancouver'
- assertVisible:
    id: 'compare-screen'
- assertVisible: '서울 vs 밴쿠버'
