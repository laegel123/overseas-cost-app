# UC: 최근/즐겨찾기가 없을 때 '비교'/'즐겨찾기' 탭 → 네이티브 Alert 안내.
# (문서의 토스트가 아니라 실제 구현은 Alert. 확인 버튼은 시뮬레이터 로케일에 따라 확인/OK.)
appId: com.laegel.overseascostapp
tags:
  - tabs
---
- runFlow:
    file: ../../common/onboard.yaml
    env:
      PERSONA: student
# 비교 탭 (대상 도시 없음)
- tapOn: '비교'
- assertVisible: '최근 본 도시나 즐겨찾기가 없어요'
- tapOn: '확인|OK'
# 즐겨찾기 탭 (대상 없음)
- tapOn: '즐겨찾기'
- assertVisible: '즐겨찾기가 없어요'
- tapOn: '확인|OK'
