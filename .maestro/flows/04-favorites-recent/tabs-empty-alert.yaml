# UC: 최근/즐겨찾기가 없을 때 '비교'/'즐겨찾기' 탭 → 네이티브 Alert 안내.
# (문서의 토스트가 아니라 실제 구현은 Alert. 확인 버튼은 시뮬레이터 로케일에 따라 확인/OK.)
appId: com.laegel.overseascostapp
tags:
  - tabs
---
- runFlow: ../../common/onboard.yaml
# 비교 탭 (대상 도시 없음). 탭바 라벨은 '비교, tab, 2 of 4' 형식 — ', tab' 로 한정 매칭.
- tapOn: '비교, tab.*'
# Alert 메시지는 '...없어요.\n홈에서...' 다중 라인 — DOTALL(?s) 로 개행 이후까지 전체 매칭.
- assertVisible: '(?s)최근 본 도시나 즐겨찾기가 없어요.*'
- tapOn: '확인|OK'
# 즐겨찾기 탭 (대상 없음). '즐겨찾기, tab' 한정 — 홈의 '즐겨찾기' 섹션 헤더와 충돌 회피.
- tapOn: '즐겨찾기, tab.*'
- assertVisible: '(?s)즐겨찾기가 없어요.*'
- tapOn: '확인|OK'
