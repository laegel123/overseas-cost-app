# UC: 최근 본 도시가 있으면 '비교' 탭이 곧바로 그 도시 Compare 로 redirect.
appId: com.laegel.overseascostapp
tags:
  - tabs
---
- runFlow: ../../common/onboard.yaml
- runFlow: ../../common/open-vancouver-compare.yaml
- tapOn:
    id: 'compare-topbar-back'
- assertVisible:
    id: 'home-screen'
# 비교 탭 → recent[0]=vancouver 로 redirect.
# 커스텀 BottomTabBar(src/components/BottomTabBar.tsx)는 각 탭에 accessibilityLabel=라벨
# ('비교')만 부여한다 — Expo Router 기본 탭바의 '비교, tab, N of M' 형식이 아니고 testID 도
# 미부여. 홈 화면엔 '비교' 텍스트가 탭 외에 없어 라벨만으로 유일 매칭된다.
- tapOn: '비교'
- assertVisible:
    id: 'compare-screen'
- assertVisible: '서울 vs 밴쿠버'
