# UC: 최초 실행 → 취업자 선택 → 홈. 설정에서 '취업자 모드'로 반영.
appId: com.laegel.overseascostapp
tags:
  - onboarding
---
- launchApp:
    clearState: true
- assertVisible:
    id: 'onboarding-screen'
- tapOn:
    id: 'persona-card-worker'
- assertVisible:
    id: 'home-screen'
- tapOn:
    id: 'home-avatar'
- assertVisible: '취업자 모드'
