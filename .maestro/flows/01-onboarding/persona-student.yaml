# UC: 최초 실행 → 유학생 선택 → 홈. 설정에서 '유학생 모드'로 반영되는지까지 확인.
appId: com.laegel.overseascostapp
tags:
  - onboarding
---
- launchApp:
    clearState: true
- assertVisible:
    id: 'onboarding-screen'
- assertVisible: '어디로 떠나시나요?'
- assertVisible: '어떤 분이신가요?'
- assertVisible: '설정에서 언제든 변경할 수 있어요'
- tapOn:
    id: 'persona-card-student'
- assertVisible:
    id: 'home-screen'
# 페르소나가 설정 화면에 '유학생 모드'로 반영되는지 확인
- tapOn:
    id: 'home-avatar'
- assertVisible:
    id: 'settings-screen'
- assertVisible: '유학생 모드'
