# UC: 설정 화면 구성 — 페르소나 카드/통계/메뉴 5종/푸터.
appId: com.laegel.overseascostapp
tags:
  - settings
---
- runFlow:
    file: ../../common/onboard.yaml
    env:
      PERSONA: student
- tapOn:
    id: 'home-avatar'
- assertVisible:
    id: 'settings-screen'
- assertVisible:
    id: 'persona-card'
- assertVisible: '유학생 모드'
- assertVisible:
    id: 'stat-favorites'
- assertVisible:
    id: 'stat-recent'
- assertVisible:
    id: 'stat-cities'
- assertVisible:
    id: 'menu-refresh'
- assertVisible:
    id: 'menu-sources'
- assertVisible:
    id: 'menu-feedback'
- assertVisible:
    id: 'menu-privacy'
- assertVisible:
    id: 'menu-app-info'
# 버전 'v1.0.0' 은 MenuRow rightText 로 시각 렌더되나 접근성 라벨('앱 정보')엔 미포함 →
# 텍스트로는 단정 불가. 앱 정보 행 존재(menu-app-info)로 대체 검증 (접근성 갭 별도 보고).
- assertVisible: 'Made with ♥ in Seoul · 2026'
