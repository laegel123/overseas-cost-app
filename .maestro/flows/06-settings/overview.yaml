# UC: 설정 화면 구성 — 데이터 최신화 카드/통계/메뉴 4종/푸터.
# ADR-067: 페르소나 카드 제거 → 데이터 최신화 카드로 교체, '데이터 새로고침' MenuRow 는
# 카드로 승격돼 메뉴가 5종 → 4종으로 줄었다.
appId: com.laegel.overseascostapp
tags:
  - settings
---
- runFlow: ../../common/onboard.yaml
- tapOn:
    id: 'home-avatar'
- assertVisible:
    id: 'settings-screen'
# 페르소나 카드 → 데이터 최신화 카드 (ADR-067)
- assertVisible:
    id: 'data-refresh-card'
- assertVisible:
    id: 'data-refresh-btn'
- assertVisible: '데이터 최신화'
- assertVisible:
    id: 'stat-favorites'
- assertVisible:
    id: 'stat-recent'
- assertVisible:
    id: 'stat-cities'
# 메뉴 4종 (새로고침은 데이터 최신화 카드로 승격 — 새로고침 메뉴 행 없음)
- assertVisible:
    id: 'menu-sources'
- assertVisible:
    id: 'menu-feedback'
- assertVisible:
    id: 'menu-privacy'
- assertVisible:
    id: 'menu-app-info'
# 버전 'v1.0.0' 은 MenuRow rightText 로 시각 렌더되나 접근성 라벨('앱 정보')엔 미포함 →
# 텍스트로는 단정 불가. 앱 정보 행 존재(menu-app-info)로 대체 검증 (접근성 갭 별도 보고).
- assertVisible: 'Made with ♥ in Seoul · 2026'
